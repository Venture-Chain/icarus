# IBC configuration for Icarus
# See https://github.com/IbcAlpha/IBC/blob/master/userguide.md

# Login credentials (injected via env vars in run.sh, not stored here)
FIX=no
IbLoginId=
IbPassword=

# Gateway mode (not TWS)
TradingMode=paper

# 2FA handling: when 2FA times out, restart the gateway so it tries again.
# You approve it on your phone via IB Key.
ExistingSessionDetectedAction=primary
AcceptIncomingConnectionAction=accept
ReadOnlyLogin=no

# 2FA timeout: wait 180 seconds for you to approve on your phone.
# If you miss it, IBC restarts the gateway and you get another chance.
SecondFactorAuthenticationTimeout=180
SecondFactorAuthenticationExitAction=restart

# API settings
OverrideTwsApiPort=4003
AcceptNonBrokerageAccountWarning=yes

# Auto-restart on disconnect
AutoRestart=yes
AutoRestartTime=00:00
